name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows server + desktop client
    # 固定在 windows-2022：windows-latest 已迁移到新镜像，Flutter 的 CMake
    # 生成器找不到 Visual Studio（"Visual Studio 16 2019 ... not found"）。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build Go server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -o dist/FrostLeaves_Server.exe ./cmd/server
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Flutter deps
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Windows client
        working-directory: flutter_app
        run: flutter build windows --release --no-pub
      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item 'flutter_app/build/windows/x64/runner/Release/*' dist/windows -Recurse -Force
          Copy-Item dist/FrostLeaves_Server.exe dist/windows -Force
          if (Test-Path user_agreement.txt) { Copy-Item user_agreement.txt dist/windows -Force }
          Compress-Archive -Path 'dist/windows/*' -DestinationPath 'dist/FrostLeaves_Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/FrostLeaves_Windows.zip

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Flutter deps
        working-directory: flutter_app
        run: flutter pub get
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Attach artifacts to release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Check whether the release already has assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ -z "$count" ]; then count=0; fi
          echo "existing=$count" >> "$GITHUB_OUTPUT"
          echo "release $GITHUB_REF_NAME already has $count asset(s)"
      - name: Rename assets from tag
        if: steps.check.outputs.existing == '0'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="${tag//-/.}"
          mkdir -p assets
          cp windows/FrostLeaves_Windows.zip "assets/Frost.Leaves.${ver}.for.windows.zip"
          cp android/app-release.apk "assets/Frost.Leaves.${ver}.for.android.apk"
          ls -la assets
      # 只有在 release 尚无资产时才附加，避免覆盖维护者本地正式签名的安装包。
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.existing == '0'
        with:
          files: assets/*
          draft: false
          prerelease: true
